<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随想笔记</title><link rel="stylesheet" href="../Study%20topics/style.css"></head><body><main><div class="topbar"><nav><a href="AI_ENGINEER_TRANSITION_PLAN.html">每日时间表</a><a href="../Study%20topics/index.html">Topic 索引</a><a href="../AI_ENGINEER_DAILY_LEARNING_GUIDE.html">学习指南</a><a href="AI_ENGINEER_PROJECT_ROADMAP.html">项目路线</a><a href="AI_ENGINEER_TOP150_RECORD.html">刷题记录</a><a href="AI_ENGINEER_VIDEOS.html">视频链接</a><a href="AI_ENGINEER_THOUGHTS.html">随想笔记</a></nav></div><script>function studyTopH(){var b=document.querySelector('.topbar'),d=document.getElementById('sp-days'),t=null;if(!b||(d&&!d.hidden))return;var h=b.offsetHeight;document.documentElement.style.setProperty('--bar-h',h+'px');try{t=location.hash&&document.getElementById(decodeURIComponent(location.hash.slice(1)))}catch(e){}if(t){var y=t.getBoundingClientRect().top;if(y>=0&&y<h)t.scrollIntoView()}}studyTopH();if(window.ResizeObserver)new ResizeObserver(studyTopH).observe(document.querySelector('.topbar'));else window.addEventListener('resize',studyTopH)</script><style>

.th-form{display:flex;flex-direction:column;gap:6px}
.th-form[hidden]{display:none}

.th-shot a{display:block;width:100%;height:100%}
.th-shot img{width:100%;height:100%;object-fit:cover;display:block}
.th-shot button{position:absolute;top:2px;right:2px;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:rgba(16,45,62,.75);color:#fff;font:14px/20px system-ui,sans-serif;cursor:pointer}
.th-form textarea.th-drop{border-color:var(--accent);box-shadow:0 0 0 3px rgba(20,110,120,.18)}
@media(max-width:760px){
 .th-grid{grid-template-columns:minmax(0,1fr)}
 .th-side{position:static;max-height:none;order:2}
 .th-main{order:1}
}
</style><h1>随想笔记</h1><div class="th-grid"><aside class="th-side" aria-label="全部笔记"><div class="th-side-head"><span id="th-count" class="muted"></span><button id="th-new" class="th-btn" type="button" hidden>+ 新笔记</button></div><ul id="th-list"></ul><p id="th-empty" class="th-empty" hidden>还没有笔记。写下第一条随想，点 Update，就会出现在这里。</p></aside><div class="th-main"><form id="th-form" class="th-form" hidden><label for="th-name">File name</label><input id="th-name" type="text" list="th-names" autocomplete="off" maxlength="60" placeholder="输入新名字，或选一篇已有的笔记"><datalist id="th-names"></datalist><label for="th-text">随想</label><textarea id="th-text" placeholder="想到什么写什么…可以 Ctrl+V 粘贴截图，或者把图片拖进来"></textarea><div id="th-shots" class="th-shots"></div><div class="th-actions"><button id="th-save" class="th-btn th-primary" type="submit">Update</button><span id="th-mode" class="muted"></span></div></form><p id="th-msg" class="muted"></p><div id="th-view" class="th-view" hidden></div></div></div><script>(function client() {
  var online = false, items = [], current = '', busy = false, showing = 0, DRAFT = 'study-thought-draft';
  function $(id) { return document.getElementById(id); }
  function msg(t) { $('th-msg').textContent = t || ''; }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function post(body) {
    return fetch('/api/thoughts', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Study': '1' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
  }
  function norm(s) { return String(s || '').replace(/\.md$/i, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function find(name) { var n = norm(name); for (var i = 0; i < items.length; i++) if (n && items[i].name.toLowerCase() === n) return items[i]; return null; }
  function when(s) { var m = /^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(s || ''); return m ? (+m[1]) + '/' + (+m[2]) + ' ' + m[3] : ''; }
  function byUpdated(a, b) { return (b.updated || '').localeCompare(a.updated || '') || a.name.localeCompare(b.name, 'zh'); }

  function renderList() {
    var ul = $('th-list'), dl = $('th-names');
    ul.textContent = ''; dl.textContent = '';
    items.forEach(function (it) {
      var li = el('li'), b = el('button', 'th-item' + (it.name === current ? ' th-on' : ''));
      b.type = 'button';
      b.appendChild(el('span', 'th-name', it.name));
      b.appendChild(el('span', 'th-meta', [when(it.updated), it.count ? it.count + ' 条' : ''].filter(Boolean).join(' · ')));
      if (it.preview) b.appendChild(el('span', 'th-prev', it.preview));
      b.addEventListener('click', function () { pick(it.name, true); });
      li.appendChild(b); ul.appendChild(li);
      var o = el('option'); o.value = it.name; dl.appendChild(o);
    });
    $('th-count').textContent = items.length ? items.length + ' 篇笔记' : '';
    $('th-empty').hidden = items.length > 0;
  }
  // under the button: what Update will do with the name in the box
  function mode() {
    var name = $('th-name').value.replace(/\s+/g, ' ').trim(), it = find(name);
    $('th-mode').textContent = !name ? '先填 File name：新名字会新建一篇，已有的名字会加到那篇的最后'
      : it ? '会加到「' + it.name + '」的最后（Ctrl+Enter 也能保存）' : '会新建「' + name + '」（Ctrl+Enter 也能保存）';
  }
  function pick(name, fill) {
    if (fill) { $('th-name').value = name; saveDraft(); }
    current = name; renderList(); mode(); show(name);
    if (fill && online) $('th-text').focus();
  }

  // a note: thoughts newest first; links are clickable
  function parseMd(md) {
    var head = [], entries = [], cur = null;
    md.replace(/\r\n?/g, '\n').split('\n').forEach(function (l) {
      var m = /^## (\d{4}-\d{2}-\d{2} \d{2}:\d{2})[ \t]*$/.exec(l);
      if (m) entries.push(cur = { at: m[1], lines: [] }); else (cur ? cur.lines : head).push(l);
    });
    function trim(a) { return a.join('\n').replace(/^\s*\n/, '').replace(/\s+$/, '').replace(/^\\(## \d{4}-)/gm, '$1'); }
    return { head: trim(head).replace(/^# .*(\n|$)/, '').replace(/^\s*\n/, ''), entries: entries.map(function (e) { return { at: e.at, text: trim(e.lines) }; }) };
  }
  // ![alt](../images/x.png) shows the image (a pasted one, next to the note; or one on the web); the rest as text with links
  var BASE = '../Study%20notes/thoughts/', IMG = /!\[([^\]\n]*)\]\(((?:images\/[\w.-]+)|(?:https:\/\/[^\s)]+))\)/g;
  function rich(parent, text) {
    var last = 0, m;
    IMG.lastIndex = 0;
    while ((m = IMG.exec(text))) {
      linkify(parent, text.slice(last, m.index));
      var src = /^https:/.test(m[2]) ? m[2] : BASE + m[2], a = el('a', 'th-imga'), img = el('img', 'th-img');
      a.href = src; a.target = '_blank'; a.rel = 'noopener'; a.title = '点开看原图';
      img.src = src; img.alt = m[1] || '图片'; img.loading = 'lazy';
      a.appendChild(img); parent.appendChild(a);
      last = IMG.lastIndex;
    }
    linkify(parent, text.slice(last));
  }
  function linkify(parent, text) {
    var re = /https?:\/\/[^\s<>"'，。！）】]+/g, last = 0, m;
    while ((m = re.exec(text))) {
      var url = m[0].replace(/[),.;:!?]+$/, ''), a = el('a', '', url);
      parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      a.href = url; a.target = '_blank'; a.rel = 'noopener'; parent.appendChild(a);
      last = re.lastIndex = m.index + url.length;
    }
    parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function renderNote(view, name, md) {
    var n = parseMd(md), head = el('div', 'th-view-head'), right = el('span');
    view.textContent = '';
    head.appendChild(el('h2', '', name));
    right.appendChild(el('span', 'muted', n.entries.length ? n.entries.length + ' 条 · 最新的在上面 ' : ''));
    if (online) {
      var del = el('button', 'th-btn', '删除');
      del.type = 'button';
      del.addEventListener('click', function () { remove(name); });
      right.appendChild(del);
    }
    head.appendChild(right); view.appendChild(head);
    if (n.head) { var h = el('div', 'th-entry'), ht = el('div', 'th-text'); rich(ht, n.head); h.appendChild(ht); view.appendChild(h); }
    n.entries.slice().reverse().forEach(function (e) {
      var box = el('div', 'th-entry'), t = el('div', 'th-text');
      box.appendChild(el('div', 'th-at', e.at));
      rich(t, e.text); box.appendChild(t); view.appendChild(box);
    });
  }
  function show(name) {
    var view = $('th-view'), my = ++showing;
    if (!name) { view.hidden = true; view.textContent = ''; return; }
    view.hidden = false;
    if (!view.firstChild) view.textContent = '正在读取…';
    fetch('../Study%20notes/thoughts/' + encodeURIComponent(name) + '.md?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (md) { if (my === showing) renderNote(view, name, md); })
      .catch(function () { if (my === showing) view.textContent = '读不到这篇笔记。网页版要等电脑推送到 GitHub 以后才有。'; });
  }
  function remove(name) {
    if (!confirm('删除「' + name + '」？这篇笔记里的全部随想都会删掉。')) return;
    busy = true; msg('正在删除…');
    post({ action: 'delete', name: name }).then(function (j) {
      items = j.items;
      if (norm($('th-name').value) === norm(name)) { $('th-name').value = ''; saveDraft(); }
      current = ''; renderList(); mode(); show(''); msg(j.message);
    }).catch(function (e) { msg('删除失败：' + e.message); }).then(function () { busy = false; });
  }

  // what is typed stays in this browser until it is saved, so closing the page by accident loses nothing
  function saveDraft() { ls(DRAFT, JSON.stringify({ name: $('th-name').value, text: $('th-text').value })); }
  try { var d = JSON.parse(ls(DRAFT) || 'null'); if (d) { $('th-name').value = d.name || ''; $('th-text').value = d.text || ''; } } catch (e) { /* no draft */ }

  function setOnline(on) { online = on; $('th-form').hidden = !on; $('th-new').hidden = !on; }
  function after(first) {
    renderList(); mode();
    var it = find($('th-name').value);
    if (first) { if (it) pick(it.name, false); else if (!online && items.length) pick(items[0].name, false); }
    else if (current) { if (find(current)) show(current); else { current = ''; renderList(); show(''); } }
  }
  function load(first) {
    fetch('/api/thoughts', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { setOnline(true); items = j.items; after(first); })
      .catch(function () {
        // web version or no server: read the pushed index, read only
        var web = location.protocol !== 'file:' && ['127.0.0.1', 'localhost'].indexOf(location.hostname) < 0;
        setOnline(false);
        fetch('../Study%20notes/thoughts/index.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
          .then(function (all) {
            items = Object.keys(all).map(function (k) { var v = all[k]; v.name = k; return v; }).sort(byUpdated);
            after(first);
            msg(web ? '网页版只能看：在电脑上打开这个页面（本地服务器）才能写随想，推送到 GitHub 后这里会更新'
              : '没有连接本地服务器：只能看已经存过的笔记。运行 start-server.bat 后才能写');
          });
      });
  }

  $('th-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('th-name').value, text = $('th-text').value, b = $('th-save');
    if (!name.trim()) { msg('先填 File name：输入新名字，或者从列表里选一篇'); return $('th-name').focus(); }
    if (!text.trim()) { msg('先写点内容'); return $('th-text').focus(); }
    if (uploading) { msg('图片还在保存，等一下再点 Update'); return; }
    b.disabled = true; busy = true; msg('正在保存…');
    post({ action: 'update', name: name, text: text }).then(function (j) {
      items = j.items; $('th-name').value = j.name; $('th-text').value = ''; saveDraft(); shots();
      current = j.name; renderList(); mode(); show(j.name); msg(j.message);
    }).catch(function (e2) { msg('保存失败：' + e2.message); }).then(function () { b.disabled = false; busy = false; });
  });
  $('th-text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if ($('th-form').requestSubmit) $('th-form').requestSubmit(); else $('th-save').click(); }
  });
  $('th-text').addEventListener('input', function () { saveDraft(); shots(); });

  // images: Ctrl+V a screenshot, or drop image files on the box. Each is uploaded (big ones shrunk first) and its
  // ![图片](../images/...) goes where the cursor is; the thumbnails under the box show what the thought will include
  function shots() {
    var box = $('th-shots'), text = $('th-text').value, m, seen = {};
    box.textContent = '';
    IMG.lastIndex = 0;
    while ((m = IMG.exec(text))) {
      if (seen[m[0]]) continue;
      seen[m[0]] = 1;
      (function (ref, rel, src) {
        var s = el('span', 'th-shot'), a = el('a'), img = el('img'), x = el('button', '', '×');
        a.href = src; a.target = '_blank'; a.rel = 'noopener'; a.title = '点开看原图';
        img.src = src; img.alt = '图片';
        x.type = 'button'; x.title = '从这条随想里去掉这张图'; x.setAttribute('aria-label', '去掉这张图');
        x.addEventListener('click', function (e) {
          e.preventDefault(); e.stopPropagation();
          var t = $('th-text');
          t.value = t.value.split(ref + '\n').join('').split(ref).join('');
          saveDraft(); shots(); t.focus();
          if (online && /^images\//.test(rel) && t.value.indexOf('(' + rel + ')') < 0) post({ action: 'drop', path: rel }).catch(function () {});
        });
        a.appendChild(img); s.appendChild(a); s.appendChild(x); box.appendChild(s);
      })(m[0], m[2], /^https:/.test(m[2]) ? m[2] : BASE + m[2]);
    }
  }
  // a screenshot of a large screen can be several MB: wider than 1800px or over 1 MB, redraw it at most 1800px wide and
  // keep the smallest of the original, PNG and WebP
  function shrink(file) {
    if (file.size <= 1024 * 1024 || file.type === 'image/gif') return Promise.resolve(file);
    return new Promise(function (done) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1800 / img.naturalWidth), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (png) {
          c.toBlob(function (webp) {
            var all = [file, png, webp && webp.type === 'image/webp' ? webp : null].filter(Boolean);
            done(all.sort(function (a, b) { return a.size - b.size; })[0]);
          }, 'image/webp', 0.9);
        }, 'image/png');
      };
      img.onerror = function () { URL.revokeObjectURL(url); done(file); };
      img.src = url;
    });
  }
  function dataUrl(blob) {
    return new Promise(function (ok, bad) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { bad(r.error); }; r.readAsDataURL(blob); });
  }
  function insertAtCursor(t, s) {
    var a = t.selectionStart, b = t.selectionEnd, before = t.value.slice(0, a), after = t.value.slice(b);
    if (before && !/\n$/.test(before)) s = '\n' + s;
    if (!/^\n/.test(after)) s += '\n';
    t.setRangeText(s, a, b, 'end');
  }
  var uploading = 0;
  function addImages(files) {
    files = [].slice.call(files || []).filter(function (f) { return /^image\/(png|jpeg|gif|webp)$/.test(f.type); });
    if (!files.length) return false;
    if (!online) { msg('没有连接本地服务器，不能加图片'); return true; }
    uploading += files.length; $('th-save').disabled = true;
    msg('正在保存图片…');
    files.reduce(function (p, f) {
      return p.then(function () {
        return shrink(f).then(dataUrl).then(function (data) { return post({ action: 'image', data: data }); }).then(function (j) {
          insertAtCursor($('th-text'), '![图片](' + j.path + ')');
          saveDraft(); shots();
          msg('图片已保存，点 Update 和文字一起存进笔记');
        }).catch(function (e) { msg('图片保存失败：' + e.message); }).then(function () { uploading--; });
      });
    }, Promise.resolve()).then(function () { if (!uploading) $('th-save').disabled = false; });
    return true;
  }
  $('th-text').addEventListener('paste', function (e) {
    var cd = e.clipboardData;
    if (!cd || (cd.getData('text/plain') || '').trim()) return;     // text (also when it comes with a picture of it, as from Excel)
    var files = [].slice.call(cd.files || []);
    if (!files.length && cd.items) [].slice.call(cd.items).forEach(function (it) { if (it.kind === 'file') { var f = it.getAsFile(); if (f) files.push(f); } });
    if (addImages(files)) e.preventDefault();
  });
  $('th-text').addEventListener('dragover', function (e) {
    if (e.dataTransfer && [].slice.call(e.dataTransfer.types || []).indexOf('Files') >= 0) { e.preventDefault(); $('th-text').classList.add('th-drop'); }
  });
  $('th-text').addEventListener('dragleave', function () { $('th-text').classList.remove('th-drop'); });
  $('th-text').addEventListener('drop', function (e) {
    $('th-text').classList.remove('th-drop');
    if (e.dataTransfer && addImages(e.dataTransfer.files)) e.preventDefault();
  });
  shots();
  $('th-name').addEventListener('input', function () {
    saveDraft(); mode();
    var it = find($('th-name').value);
    if (it && it.name !== current) pick(it.name, false);
    else if (!it && current) { current = ''; renderList(); show(''); }
  });
  $('th-new').addEventListener('click', function () {
    $('th-name').value = ''; saveDraft(); current = ''; renderList(); mode(); show(''); msg(''); $('th-name').focus();
  });
  load(true);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !busy) load(false); });
})();</script></main></body></html>
